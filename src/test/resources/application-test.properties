spring.datasource.url=jdbc:h2:mem:employeedb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false

# Non-production signing material for slice tests only; overridden from the
# environment in every real deployment.
app.jwt.secret=${TEST_JWT_KEY:ephemeral-slice-test-signing-material-0123456789}
app.jwt.ttl-seconds=3600
app.admin.username=admin
app.admin.password=
