# GENERATED by UDAP Build Project from .udap/pipeline.yaml — do not
# edit by hand; change the spec and re-render.
name: build-deploy
'on':
  workflow_dispatch: {}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Maven build
      run: mvn -B -ntp -DskipTests compile
    - name: Checkstyle
      run: mvn -B -ntp checkstyle:check
    - name: PMD
      run: mvn -B -ntp pmd:check
    - name: SpotBugs
      run: mvn -B -ntp spotbugs:check
  unit_tests:
    runs-on: ubuntu-latest
    needs:
    - quality
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Unit tests + JaCoCo (90% line coverage gate)
      run: mvn -B -ntp verify
    - name: Publish coverage report
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report
        path: target/site/jacoco
  sast:
    runs-on: ubuntu-latest
    needs:
    - quality
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Semgrep SAST
      uses: semgrep/semgrep-action@v1
      with:
        config: p/java p/secrets
  image:
    runs-on: ubuntu-latest
    needs:
    - unit_tests
    - sast
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    timeout-minutes: 35
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Package application
      run: mvn -B -ntp -DskipTests package
    - name: Log in to GHCR
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor
        }} --password-stdin
    - name: Docker build
      run: 'IMAGE_LC="$(echo "$IMAGE" | tr ''[:upper:]'' ''[:lower:]'')"

        docker build -t "$IMAGE_LC:${{ github.sha }}" -t "$IMAGE_LC:latest" .

        '
    - name: Trivy container scan
      run: 'IMAGE_LC="$(echo "$IMAGE" | tr ''[:upper:]'' ''[:lower:]'')"

        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
        | sh -s -- -b /usr/local/bin v0.55.2

        trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_LC:${{
        github.sha }}"

        '
    - name: Push image to GHCR
      run: 'IMAGE_LC="$(echo "$IMAGE" | tr ''[:upper:]'' ''[:lower:]'')"

        docker push "$IMAGE_LC:${{ github.sha }}"

        docker push "$IMAGE_LC:latest"

        '
  deploy_ec2:
    runs-on: ubuntu-latest
    needs:
    - image
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - id: tf
      name: Read infrastructure outputs
      run: 'echo "host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"

        terraform output -raw db_endpoint > /tmp/db_endpoint

        terraform output -raw db_name > /tmp/db_name

        terraform output -raw db_username > /tmp/db_username

        '
      working-directory: infra
    - name: Write SSH key
      run: 'mkdir -p ~/.ssh

        printf ''%s\n'' "$SSH_KEY" > ~/.ssh/deploy_key

        chmod 600 ~/.ssh/deploy_key

        ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

        '
      env:
        SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: ${{ steps.tf.outputs.host }}
    - name: Render Puppet hieradata
      run: bash puppet/render_hieradata.sh
      env:
        IMAGE_REF: ghcr.io/${{ github.repository }}
        IMAGE_TAG: ${{ github.sha }}
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
    - name: Copy Puppet code to instance
      run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -r puppet
        "$SSH_USER@$HOST:/tmp/puppet"
      env:
        HOST: ${{ steps.tf.outputs.host }}
        SSH_USER: ${{ secrets.SSH_USER }}
    - name: Install Puppet agent
      run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST"
        'bash /tmp/puppet/bootstrap.sh'
      env:
        HOST: ${{ steps.tf.outputs.host }}
        SSH_USER: ${{ secrets.SSH_USER }}
    - name: Puppet apply (Docker, Nginx, systemd, container)
      run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST"
        'sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes --modulepath=/tmp/puppet/modules
        --hiera_config=/tmp/puppet/hiera.yaml /tmp/puppet/manifests/site.pp; rc=$?;
        test $rc -eq 0 -o $rc -eq 2'
      env:
        HOST: ${{ steps.tf.outputs.host }}
        SSH_USER: ${{ secrets.SSH_USER }}
  health:
    runs-on: ubuntu-latest
    needs:
    - deploy_ec2
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Verify application health via Nginx
      run: 'HOST="$(terraform output -raw public_ip)"

        curl --fail --retry 20 --retry-delay 15 --retry-all-errors "http://$HOST/actuator/health"

        '
      working-directory: infra
