# edit by hand; change the spec and re-render.
name: validation
'on':
  workflow_dispatch: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Smoke tests (health, Nginx proxy, database connectivity)
      run: 'HOST="$(cd infra && terraform output -raw public_ip)"

        BASE_URL="http://$HOST" bash tests/smoke.sh

        '
  functional:
    runs-on: ubuntu-latest
    needs:
    - smoke
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install test dependencies
      run: python3 -m pip install --quiet -r tests/requirements.txt
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Functional API and integration tests
      run: 'mkdir -p reports

        HOST="$(cd infra && terraform output -raw public_ip)"

        BASE_URL="http://$HOST" python3 -m pytest tests/api -v --html=reports/functional.html
        --self-contained-html

        '
    - name: Publish functional report
      uses: actions/upload-artifact@v4
      with:
        name: functional-report
        path: reports/functional.html
  load:
    runs-on: ubuntu-latest
    needs:
    - functional
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.9.8
    - name: Terraform init
      run: "terraform init -input=false -reconfigure \\\n  -backend-config=\"bucket=${{\
        \ secrets.TF_STATE_BUCKET }}\" \\\n  -backend-config=\"key=${{ secrets.PROJECT_NAME\
        \ }}/terraform.tfstate\" \\\n  -backend-config=\"region=us-east-1\"\n"
      working-directory: infra
    - name: Install k6
      run: 'curl -sSL https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz
        -o /tmp/k6.tar.gz

        tar -xzf /tmp/k6.tar.gz -C /tmp

        sudo install /tmp/k6-v0.53.0-linux-amd64/k6 /usr/local/bin/k6

        '
    - name: k6 load test (p95 under 500ms, error rate under 1 percent)
      run: 'mkdir -p reports

        HOST="$(cd infra && terraform output -raw public_ip)"

        BASE_URL="http://$HOST" k6 run --summary-export=reports/k6-summary.json tests/load/load-test.js

        '
    - name: Publish k6 summary
      uses: actions/upload-artifact@v4
      with:
        name: k6-summary
        path: reports/k6-summary.json
  report:
    runs-on: ubuntu-latest
    needs:
    - load
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Download functional report
      uses: actions/download-artifact@v4
      with:
        name: functional-report
        path: reports
    - name: Download k6 summary
      uses: actions/download-artifact@v4
      with:
        name: k6-summary
        path: reports
    - name: Generate HTML validation report
      run: python3 tests/generate_report.py
    - name: Publish validation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: validation-reports
        path: reports
