version: 1
name: employee-mgmt-api
vcs: github
rollback:
  strategy: manual

stages:
  - id: lint
    kind: lint
    timeout_minutes: 20
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Checkstyle
        run: mvn -B -ntp checkstyle:check
      - name: PMD
        run: mvn -B -ntp pmd:check
      - name: SpotBugs
        run: mvn -B -ntp compile spotbugs:check

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 30
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests with JaCoCo coverage gate
        run: mvn -B -ntp verify

  # Blocking SAST for the deploy path. OWASP dependency-check lives in the
  # dedicated dependency-scan workflow instead: it depends on the external NVD
  # API, whose availability must not decide whether a release can ship. Image
  # CVEs are still blocked here by Trivy in build_push.
  - id: security
    kind: security
    needs: [lint]
    timeout_minutes: 20
    steps:
      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/java
            p/secrets

  - id: build_push
    kind: build_push
    needs: [test, security]
    timeout_minutes: 35
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package application
        run: mvn -B -ntp -DskipTests package
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Build image
        run: |
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker build -t "$IMAGE_LC:${{ github.sha }}" -t "$IMAGE_LC:latest" .
      - name: Trivy container scan
        run: |
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.55.2
          trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_LC:${{ github.sha }}"
      - name: Push image
        run: |
          IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          docker push "$IMAGE_LC:${{ github.sha }}"
          docker push "$IMAGE_LC:latest"

  - id: provision
    kind: provision
    needs: [build_push]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Terraform format check
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Terraform validate
        working-directory: infra
        run: terraform validate
      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Read infrastructure outputs
        id: tf
        working-directory: infra
        run: |
          echo "host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
          terraform output -raw db_endpoint > /tmp/db_endpoint
          terraform output -raw db_name > /tmp/db_name
          terraform output -raw db_username > /tmp/db_username
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ steps.tf.outputs.host }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
      - name: Render Puppet hieradata
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: bash puppet/render_hieradata.sh
      - name: Copy Puppet code to instance
        env:
          HOST: ${{ steps.tf.outputs.host }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -r puppet "$SSH_USER@$HOST:/tmp/puppet"
      - name: Install Puppet agent
        env:
          HOST: ${{ steps.tf.outputs.host }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" 'bash /tmp/puppet/bootstrap.sh'
      - name: Puppet apply (Docker, Nginx, systemd, container)
        env:
          HOST: ${{ steps.tf.outputs.host }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" 'sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes --modulepath=/tmp/puppet/modules --hiera_config=/tmp/puppet/hiera.yaml /tmp/puppet/manifests/site.pp; rc=$?; test $rc -eq 0 -o $rc -eq 2'

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 20
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: us-east-1
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    steps:
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=us-east-1"
      - name: Health check through Nginx
        working-directory: infra
        run: |
          HOST="$(terraform output -raw public_ip)"
          curl --fail --retry 20 --retry-delay 15 --retry-all-errors "http://$HOST/actuator/health"
      - name: Verify API documentation is published
        working-directory: infra
        run: |
          HOST="$(terraform output -raw public_ip)"
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors "http://$HOST/v3/api-docs"

pipelines:
  - id: infrastructure
    stages:
      - id: terraform_provision
        kind: provision
        timeout_minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Terraform format
            working-directory: infra
            run: terraform fmt -check -recursive
          - name: Terraform validate
            working-directory: infra
            run: terraform validate
          - name: Terraform plan
            working-directory: infra
            run: terraform plan -input=false -out=tfplan
          - name: Terraform apply
            working-directory: infra
            run: terraform apply -input=false -auto-approve tfplan

      - id: verify_infrastructure
        kind: verify
        needs: [terraform_provision]
        timeout_minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Verify VPC
            working-directory: infra
            run: bash ../scripts/verify_infra.sh vpc
          - name: Verify Security Groups
            working-directory: infra
            run: bash ../scripts/verify_infra.sh security_groups
          - name: Verify EC2 instance
            working-directory: infra
            run: bash ../scripts/verify_infra.sh ec2
          - name: Verify Elastic IP
            working-directory: infra
            run: bash ../scripts/verify_infra.sh eip
          - name: Verify RDS PostgreSQL
            working-directory: infra
            run: bash ../scripts/verify_infra.sh rds
          - name: Generate Terraform outputs report
            working-directory: infra
            run: bash ../scripts/verify_infra.sh report
          - name: Publish infrastructure report
            uses: actions/upload-artifact@v4
            with:
              name: terraform-outputs
              path: infra/terraform-outputs.md

  - id: build-deploy
    stages:
      - id: quality
        kind: lint
        timeout_minutes: 25
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '21'
              cache: maven
          - name: Maven build
            run: mvn -B -ntp -DskipTests compile
          - name: Checkstyle
            run: mvn -B -ntp checkstyle:check
          - name: PMD
            run: mvn -B -ntp pmd:check
          - name: SpotBugs
            run: mvn -B -ntp spotbugs:check

      - id: unit_tests
        kind: test
        needs: [quality]
        timeout_minutes: 30
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '21'
              cache: maven
          - name: Unit tests + JaCoCo (90% line coverage gate)
            run: mvn -B -ntp verify
          - name: Publish coverage report
            uses: actions/upload-artifact@v4
            with:
              name: jacoco-report
              path: target/site/jacoco

      # Blocking SAST. Dependency CVE scanning runs in the dependency-scan
      # workflow, which does not gate releases on NVD API availability.
      - id: sast
        kind: security
        needs: [quality]
        timeout_minutes: 20
        steps:
          - name: Semgrep SAST
            uses: semgrep/semgrep-action@v1
            with:
              config: >-
                p/java
                p/secrets

      - id: image
        kind: build_push
        needs: [unit_tests, sast]
        timeout_minutes: 35
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '21'
              cache: maven
          - name: Package application
            run: mvn -B -ntp -DskipTests package
          - name: Log in to GHCR
            run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          - name: Docker build
            run: |
              IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
              docker build -t "$IMAGE_LC:${{ github.sha }}" -t "$IMAGE_LC:latest" .
          - name: Trivy container scan
            run: |
              IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
              curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.55.2
              trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_LC:${{ github.sha }}"
          - name: Push image to GHCR
            run: |
              IMAGE_LC="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
              docker push "$IMAGE_LC:${{ github.sha }}"
              docker push "$IMAGE_LC:latest"

      - id: deploy_ec2
        kind: configure
        needs: [image]
        timeout_minutes: 45
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Read infrastructure outputs
            id: tf
            working-directory: infra
            run: |
              echo "host=$(terraform output -raw public_ip)" >> "$GITHUB_OUTPUT"
              terraform output -raw db_endpoint > /tmp/db_endpoint
              terraform output -raw db_name > /tmp/db_name
              terraform output -raw db_username > /tmp/db_username
          - name: Write SSH key
            env:
              SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
              HOST: ${{ steps.tf.outputs.host }}
            run: |
              mkdir -p ~/.ssh
              printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
              chmod 600 ~/.ssh/deploy_key
              ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          - name: Render Puppet hieradata
            env:
              IMAGE_REF: ghcr.io/${{ github.repository }}
              IMAGE_TAG: ${{ github.sha }}
              GHCR_USER: ${{ github.actor }}
              GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
              JWT_SECRET: ${{ secrets.JWT_SECRET }}
            run: bash puppet/render_hieradata.sh
          - name: Copy Puppet code to instance
            env:
              HOST: ${{ steps.tf.outputs.host }}
              SSH_USER: ${{ secrets.SSH_USER }}
            run: scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -r puppet "$SSH_USER@$HOST:/tmp/puppet"
          - name: Install Puppet agent
            env:
              HOST: ${{ steps.tf.outputs.host }}
              SSH_USER: ${{ secrets.SSH_USER }}
            run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" 'bash /tmp/puppet/bootstrap.sh'
          - name: Puppet apply (Docker, Nginx, systemd, container)
            env:
              HOST: ${{ steps.tf.outputs.host }}
              SSH_USER: ${{ secrets.SSH_USER }}
            run: ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$SSH_USER@$HOST" 'sudo /opt/puppetlabs/bin/puppet apply --detailed-exitcodes --modulepath=/tmp/puppet/modules --hiera_config=/tmp/puppet/hiera.yaml /tmp/puppet/manifests/site.pp; rc=$?; test $rc -eq 0 -o $rc -eq 2'

      - id: health
        kind: verify
        needs: [deploy_ec2]
        timeout_minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Verify application health via Nginx
            working-directory: infra
            run: |
              HOST="$(terraform output -raw public_ip)"
              curl --fail --retry 20 --retry-delay 15 --retry-all-errors "http://$HOST/actuator/health"

  # OWASP dependency-check, run on its own so that NVD API availability never
  # decides whether a release can ship. The gate itself is UNCHANGED: it still
  # fails the run on any dependency at CVSS >= 9 and publishes the full report.
  - id: dependency-scan
    stages:
      - id: owasp
        kind: security
        timeout_minutes: 60
        steps:
          - name: Set up JDK 21
            uses: actions/setup-java@v4
            with:
              distribution: temurin
              java-version: '21'
              cache: maven
          - name: OWASP dependency-check (fails on CVSS >= 9)
            env:
              NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
            run: mvn -B -ntp org.owasp:dependency-check-maven:check -Dnvd.api.key="$NVD_API_KEY"
          - name: Publish dependency-check report
            uses: actions/upload-artifact@v4
            with:
              name: dependency-check-report
              path: target/dependency-check-report.html

  - id: validation
    stages:
      - id: smoke
        kind: verify
        timeout_minutes: 20
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Smoke tests (health, Nginx proxy, database connectivity)
            run: |
              HOST="$(cd infra && terraform output -raw public_ip)"
              BASE_URL="http://$HOST" bash tests/smoke.sh

      - id: functional
        kind: e2e
        needs: [smoke]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
          - name: Install test dependencies
            run: python3 -m pip install --quiet -r tests/requirements.txt
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Functional API and integration tests
            run: |
              mkdir -p reports
              HOST="$(cd infra && terraform output -raw public_ip)"
              BASE_URL="http://$HOST" python3 -m pytest tests/api -v --html=reports/functional.html --self-contained-html
          - name: Publish functional report
            uses: actions/upload-artifact@v4
            with:
              name: functional-report
              path: reports/functional.html

      - id: load
        kind: perf
        needs: [functional]
        timeout_minutes: 30
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
          TF_VAR_aws_region: us-east-1
          TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        steps:
          - name: Set up Terraform
            uses: hashicorp/setup-terraform@v3
            with:
              terraform_version: 1.9.8
          - name: Terraform init
            working-directory: infra
            run: |
              terraform init -input=false -reconfigure \
                -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
                -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
                -backend-config="region=us-east-1"
          - name: Install k6
            run: |
              curl -sSL https://github.com/grafana/k6/releases/download/v0.53.0/k6-v0.53.0-linux-amd64.tar.gz -o /tmp/k6.tar.gz
              tar -xzf /tmp/k6.tar.gz -C /tmp
              sudo install /tmp/k6-v0.53.0-linux-amd64/k6 /usr/local/bin/k6
          - name: k6 load test (p95 under 500ms, error rate under 1 percent)
            run: |
              mkdir -p reports
              HOST="$(cd infra && terraform output -raw public_ip)"
              BASE_URL="http://$HOST" k6 run --summary-export=reports/k6-summary.json tests/load/load-test.js
          - name: Publish k6 summary
            uses: actions/upload-artifact@v4
            with:
              name: k6-summary
              path: reports/k6-summary.json

      - id: report
        kind: custom
        needs: [load]
        timeout_minutes: 15
        steps:
          - name: Set up Python
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
          - name: Download functional report
            uses: actions/download-artifact@v4
            with:
              name: functional-report
              path: reports
          - name: Download k6 summary
            uses: actions/download-artifact@v4
            with:
              name: k6-summary
              path: reports
          - name: Generate HTML validation report
            run: python3 tests/generate_report.py
          - name: Publish validation artifacts
            uses: actions/upload-artifact@v4
            with:
              name: validation-reports
              path: reports
